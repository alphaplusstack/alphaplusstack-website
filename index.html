    <script>
      // Apply saved theme before paint to avoid a light/dark flash
      (function () {
        try {
          var saved = localStorage.getItem('aps-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : false; // light is default even if system is dark
          if (saved === 'system') isDark = systemDark;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
